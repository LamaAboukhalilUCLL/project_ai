<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="5">
<title>SQL Query Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 20px; color: #fff; display:flex; align-items:center; gap:10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #1D9E75; display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .metric { background: #1a1d27; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 14px 18px; }
  .metric-val { font-size: 24px; font-weight: 500; color: #a78bfa; }
  .metric-lbl { font-size: 11px; color: #6b7280; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

  .section-head { font-size: 12px; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 14px; }

  .cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px; }
  .card { background: #1a1d27; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 18px 20px; border-left: 3px solid #E24B4A; }
  .card.fixed { border-left-color: #1D9E75; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .b-slow { background: rgba(226,75,74,.15); color: #f87171; }
  .b-conf { background: rgba(167,139,250,.15); color: #a78bfa; }
  .b-fixed { background: rgba(29,158,117,.15); color: #34d399; }
  .b-model { background: rgba(56,130,246,.15); color: #60a5fa; }
  .ts { font-size: 12px; color: #6b7280; white-space: nowrap; }

  .card-body { display: grid; grid-template-columns: 1fr 220px; gap: 16px; align-items: start; }
  .card-sql { min-width: 0; }
  .lbl { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 5px; }
  .lbl:first-child { margin-top: 0; }
  .code { background: #0a0c10; border: 0.5px solid #1e2230; border-radius: 6px; padding: 8px 12px; font-family: Consolas, monospace; font-size: 12px; color: #a0aec0; white-space: pre-wrap; word-break: break-all; }
  .reason { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .speedup-txt { font-size: 13px; color: #34d399; font-weight: 500; margin-top: 8px; }
  .verified-txt { font-size: 12px; color: #6b7280; margin-top: 3px; }

  .mini-chart-wrap { display: flex; flex-direction: column; gap: 6px; }
  .mini-chart-title { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 11px; color: #9ca3af; width: 36px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; background: #0a0c10; border-radius: 4px; height: 28px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 6px; font-size: 10px; font-weight: 500; white-space: nowrap; transition: width .4s ease; }
  .bar-slow { background: rgba(226,75,74,.7); color: #fca5a5; }
  .bar-fixed { background: rgba(29,158,117,.7); color: #6ee7b7; }

  .chart-section { margin-top: 8px; }
  .chart-outer { background: #1a1d27; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; width: 100%; height: 400px; }
  .legend { display: flex; gap: 20px; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ca3af; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  .empty { text-align: center; color: #6b7280; padding: 60px; font-size: 14px; }

  @media (max-width: 640px) {
    .card-body { grid-template-columns: 1fr; }
    .mini-chart-wrap { display: none; }
  }
</style>
</head>
<body>

<h1><span class="dot"></span>SQL Query Monitor</h1>

<div class="metrics" id="stats">
  <div class="metric"><div class="metric-val">—</div><div class="metric-lbl">Total monitored</div></div>
  <div class="metric"><div class="metric-val">—</div><div class="metric-lbl">Flagged</div></div>
  <div class="metric"><div class="metric-val">—</div><div class="metric-lbl">Fixes verified</div></div>
  <div class="metric"><div class="metric-val">—</div><div class="metric-lbl">Avg speedup</div></div>
  <div class="metric"><div class="metric-val">—</div><div class="metric-lbl">Total time saved</div></div>
</div>

<div class="section-head">Recent query fixes</div>
<div class="cards" id="queries">
  <div class="empty">No slow queries detected yet.</div>
</div>

<div class="chart-section" id="chart-section" style="display:none;">
  <div class="section-head">Execution time — slow vs fixed</div>
  <div class="chart-outer">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#E24B4A;"></div>Slow (ms)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1D9E75;"></div>Fixed (ms)</div>
    </div>
    <div class="chart-wrap">
      <canvas id="cmpChart" role="img" aria-label="Grouped bar chart comparing slow vs fixed query execution times">Execution time comparison for verified query fixes.</canvas>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtTime(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleTimeString(); } catch(e) { return ts; }
}

function modelLabel(src) {
  if (!src) return '';
  if (src.includes('sqlcoder')) return 'SQLCoder-7B';
  if (src === 'gpt') return 'GPT';
  return src;
}

function miniChart(slowMs, fixedMs) {
  const max = Math.max(slowMs, fixedMs, 1);
  const slowPct = Math.max((slowMs / max) * 100, 3).toFixed(1);
  const fixedPct = Math.max((fixedMs / max) * 100, 3).toFixed(1);
  const fmtSlow  = slowMs >= 1000  ? (slowMs/1000).toFixed(2)+'s'  : slowMs.toFixed(0)+'ms';
  const fmtFixed = fixedMs >= 1000 ? (fixedMs/1000).toFixed(2)+'s' : fixedMs.toFixed(1)+'ms';
  return `
    <div class="mini-chart-wrap">
      <div class="mini-chart-title">Execution time</div>
      <div class="bar-row">
        <div class="bar-label">Before</div>
        <div class="bar-track">
          <div class="bar-fill bar-slow" style="width:${slowPct}%">${fmtSlow}</div>
        </div>
      </div>
      <div class="bar-row">
        <div class="bar-label">After</div>
        <div class="bar-track">
          <div class="bar-fill bar-fixed" style="width:${fixedPct}%">${fmtFixed}</div>
        </div>
      </div>
    </div>`;
}

let cmpChart = null;

function buildChart(fixed) {
  const labels   = fixed.map((q, i) => q.query.replace(/\s+/g,' ').slice(0,28) + '…');
  const slowData  = fixed.map(q => q.avg_time_ms);
  const fixedData = fixed.map(q => q.warm_median_ms != null ? q.warm_median_ms : Math.max(0, q.avg_time_ms - q.speedup_ms));

  const ctx = document.getElementById('cmpChart');
  if (cmpChart) cmpChart.destroy();
  cmpChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Slow (ms)',  data: slowData,  backgroundColor: '#E24B4A', borderRadius: 4 },
        { label: 'Fixed (ms)', data: fixedData, backgroundColor: '#1D9E75', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}ms`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#6b7280', font: { size: 11 }, autoSkip: false, maxRotation: 30 },
          grid:  { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          type: 'logarithmic',
          ticks: {
            color: '#6b7280',
            font: { size: 11 },
            callback: v => v >= 1000 ? (v/1000).toFixed(1)+'s' : v+'ms'
          },
          grid: { color: 'rgba(255,255,255,0.05)' }
        }
      }
    }
  });
}

async function load() {
  try {
    const [sRes, qRes] = await Promise.all([fetch('/api/stats'), fetch('/api/queries')]);
    const stats   = await sRes.json();
    const queries = await qRes.json();

    document.getElementById('stats').innerHTML = `
      <div class="metric"><div class="metric-val">${stats.total}</div><div class="metric-lbl">Total monitored</div></div>
      <div class="metric"><div class="metric-val">${stats.flagged}</div><div class="metric-lbl">Flagged</div></div>
      <div class="metric"><div class="metric-val">${stats.fixed}</div><div class="metric-lbl">Fixes verified</div></div>
      <div class="metric"><div class="metric-val">${stats.avg_speedup}ms</div><div class="metric-lbl">Avg speedup</div></div>
      <div class="metric"><div class="metric-val">${(stats.total_saved_ms/1000).toFixed(1)}s</div><div class="metric-lbl">Total time saved</div></div>
    `;

    const el = document.getElementById('queries');
    if (!queries.length) {
      el.innerHTML = '<div class="empty">No slow queries detected yet. Run a slow query in pgAdmin to see it here.</div>';
      return;
    }

    el.innerHTML = [...queries].reverse().map(q => {
      const isFixed   = q.speedup_ms > 0;
      const warmMs    = q.warm_median_ms != null ? q.warm_median_ms : null;
      const ml        = modelLabel(q.llm_source);
      const hasMini   = isFixed && warmMs != null;

      return `
        <div class="card ${isFixed ? 'fixed' : ''}">
          <div class="card-top">
            <div class="badges">
              <span class="badge b-slow">${q.avg_time_ms}ms</span>
              <span class="badge b-conf">${q.confidence}% slow</span>
              ${isFixed ? '<span class="badge b-fixed">✓ Fixed</span>' : ''}
              ${ml ? `<span class="badge b-model">${esc(ml)}</span>` : ''}
            </div>
            <span class="ts">${fmtTime(q.timestamp)}</span>
          </div>
          <div class="card-body">
            <div class="card-sql">
              <div class="lbl">Slow query</div>
              <div class="code">${esc(q.query)}</div>
              ${q.fix ? `
                <div class="lbl">Fix${q.strategy ? ' — '+esc(q.strategy) : ''}</div>
                <div class="code">${esc(q.fix)}</div>
              ` : ''}
              ${isFixed ? `
                <div class="speedup-txt">⚡ ${q.speedup_ms}ms faster</div>
                ${warmMs != null ? `<div class="verified-txt">Verified: ${Math.round(warmMs * 10) / 10}ms warm median</div>` : ''}
              ` : ''}
            </div>
            ${hasMini ? miniChart(q.avg_time_ms, warmMs) : '<div></div>'}
          </div>
        </div>`;
    }).join('');

    const fixed = queries.filter(q => q.speedup_ms > 0 && q.warm_median_ms != null);
    if (fixed.length > 0) {
      document.getElementById('chart-section').style.display = '';
      buildChart(fixed);
    }

  } catch(e) {
    console.error('Dashboard load error:', e);
  }
}

load();
</script>
</body>
</html>
